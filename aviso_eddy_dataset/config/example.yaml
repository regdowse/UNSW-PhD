paths:
  data_root: /srv/scratch/z5502183/AVISO_0.125
  output_root: /srv/scratch/z5297792/aviso_eddy_dataset
  esp_zonodo: /home/z5297792/ESP_zonodo

files:
  pattern: AVISO_0.125_EAC_*.nc

variables:
  longitude: longitude
  latitude: latitude
  time: time
  u: ugos
  v: vgos

parallel:
  workers: 8
  backend: process
  skip_existing: true

nencioli:
  a: 4
  b: 3
  # Only Nencioli uses this interpolated grid. DOPPIO uses the native AVISO grid.
  interpolation_resolution_km: 1.0

surface_fit:
  transect_radius_km: 30.0
  rho_max_km: 200.0
  rho_min_km: 30.0
  local_limit_factor: 3.0
  out_core_fac: 1.75
  omega_units_scale: 1.0e-3
  omega0_abs_threshold: 5.0e-5
  center_error_mad_threshold: 4.0

tracking:
  length_scale_km: 50.0
  omega0_scale: 1.0e-5
  radius_threshold: 1.0
  lookback_days: 4

processing:
  date_origin: "1990-01-01"
  min_duration_days: 21
  ar_max: 5.0
  rc_max_km: 300.0
  rc_r_ratio_max: 1.75
  omega_abs_max: 5.0e-5
  psi0_abs_max: 300.0
  mean_radius_min_km: 15.0
  max_outer_gap_days: null
